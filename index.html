
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Moving - Redirecting...</title>
    <!-- Fallback redirect in case JavaScript is disabled -->
    <meta http-equiv="refresh" content="5;url=https://playcodeindia.github.io">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #d9534f;
            font-size: 24px;
            margin-top: 0;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        .new-url {
            font-size: 18px;
            font-weight: bold;
            color: #0056b3;
            text-decoration: none;
            word-break: break-all;
        }
        .new-url:hover {
            text-decoration: underline;
        }
        .timer-text {
            margin: 25px 0;
            font-size: 18px;
            font-weight: 500;
        }
        #timer {
            color: #d9534f;
            font-weight: bold;
            font-size: 22px;
        }
        .redirect-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .redirect-btn:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Notice: Domain Changing</h1>
        <p>This domain will be removed soon. Please go to our new URL:</p>
        <p><a href="https://playcodeindia.github.io" class="new-url">playcodeindia.github.io</a></p>
        
        <div class="timer-text">
            Redirecting automatically in <span id="timer">5</span> seconds...
        </div>

        <button class="redirect-btn" onclick="redirectNow()">Redirect Now</button>
    </div>

    <script>
        // Target URL for the redirect
        const targetUrl = "https://playcodeindia.github.io";
        
        // Timer countdown logic
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                redirectNow();
            }
        }, 1000);

        // Function to handle immediate redirect
        function redirectNow() {
            window.location.href = targetUrl;
        }
    </script>

</body>
</html>
